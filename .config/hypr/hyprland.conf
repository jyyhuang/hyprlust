################
### MONITORS ###
################
monitor=,preferred,auto,1

###################
### MY PROGRAMS ###
###################
# Set programs that you use
$terminal = wezterm start --always-new-process
$menu = rofi -show drun

source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/colors-hyprland.conf

#################
### AUTOSTART ###
#################
exec-once = wal -R & hypridle
exec-once = $terminal
exec-once = systemctl --user start hyprpolkitagent
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = awww-daemon & waybar
exec-once = wl-paste --watch cliphist store #Stores only text data
exec-once = rm "$HOME/.cache/cliphist/db"
exec-once = hypridle
exec-once = hyprsunset

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = HYPRCURSOR_THEME,Miku
env = HYPRCURSOR_SIZE,32

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORM,wayland


#####################
### LOOK AND FEEL ###
#####################
general { 
    gaps_in = 5
    gaps_out = 10

    border_size = 3

    col.active_border = $color11
    #col.inactive_border = rgba(595959aa)
    col.inactive_border = $background

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false 

    allow_tearing = false

    layout = master
}

decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = true
        ignore_opacity = true
        brightness = 1.0
        vibrancy = 0.5
    }
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 3, default
}

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = slave
    mfact = 0.5
}

misc { 
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:super
    kb_rules =

    follow_mouse = 1

    sensitivity = -0.5 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

##############################
### WINDOWS AND WORKSPACES ###
##############################
windowrule = suppress_event maximize, match:class .* # You'll probably like this.
windowrule = workspace 2, match:class firefox
windowrule = workspace 3 silent, match:class vesktop
windowrule = border_color $color15, match:fullscreen 1
windowrule = opacity 0.9, match:class nemo

layerrule = blur on, match:class rofi
